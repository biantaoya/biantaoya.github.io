name: 自动更新英雄数据

on:
  push:
    paths:
      - 'data.xlsx'        # Excel 变化时自动转换
  workflow_dispatch:        # 也允许在 Actions 页面手动触发

# 同一时间只跑一个，避免两次 push 撞在一起各推各的
concurrency:
  group: update-hero-data
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 需要把 heroes.json 推回仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # convert.py 自带校验：列名不对或英雄数异常会直接退出，不会提交坏数据
      - name: 转换 Excel 为 JSON
        run: python convert.py

      - name: 同步 sitemap 的 lastmod
        run: |
          today=$(date -u +%F)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${today}</lastmod>|" sitemap.xml

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heroes.json sitemap.xml
          git diff --staged --quiet || git commit -m "🤖 自动更新英雄数据"
          git push
