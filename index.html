<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1280px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-icon {
            font-size: 2.4rem;
            line-height: 1;
        }

        h1 {
            font-weight: 700;
            font-size: 2.4rem;
            letter-spacing: -0.02em;
            color: #1a1a2e;
            margin: 0;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            padding-left: 0.8rem;
            border-left: 3px solid #d4a853;
            font-weight: 400;
        }

        .version-badge {
            background: #e5e7eb;
            border-radius: 40px;
            padding: 0.25rem 1rem;
            font-size: 0.75rem;
            color: #4b5563;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* ===== 筛选栏 ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
            background: #ffffff;
            border-radius: 60px;
            padding: 0.5rem 0.5rem 0.5rem 1.2rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filters:focus-within {
            border-color: #d4a853;
            box-shadow: 0 2px 12px rgba(212, 168, 83, 0.15);
        }

        .search-box {
            flex: 2;
            min-width: 180px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 2.4rem 0.6rem 0.8rem;
            font-size: 0.95rem;
            border: none;
            background: transparent;
            color: #1a1a2e;
            outline: none;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        .search-box .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            display: none;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .search-box .clear-btn.visible {
            display: block;
        }

        .search-box .clear-btn:hover {
            background: #f3f4f6;
            color: #4b5563;
        }

        .type-filter {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            padding-right: 0.2rem;
        }

        .type-filter button {
            background: transparent;
            border: none;
            color: #6b7280;
            padding: 0.35rem 0.9rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .type-filter button:hover {
            color: #1a1a2e;
            background: #f3f4f6;
        }

        .type-filter button.active {
            background: #d4a853;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(212, 168, 83, 0.3);
        }

        /* ===== 统计 ===== */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
            color: #6b7280;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .stats .count {
            background: #ffffff;
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #e5e7eb;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1a1a2e;
        }

        .stats .match-info {
            background: #f9fafb;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #6b7280;
        }

        /* ===== 网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        /* ===== 卡片 ===== */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.2rem 1.4rem 1.4rem;
            border: 1px solid #e5e7eb;
            transition: transform 0.15s ease, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4a853, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            border-color: #d4a853;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card .hero-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .card .hero-header img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
            object-fit: cover;
            background: #f9fafb;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }

        .card:hover .hero-header img {
            border-color: #d4a853;
        }

        .card .hero-header .hero-name {
            font-size: 1.2rem;
            font-weight: 600;
            flex: 1;
            letter-spacing: -0.01em;
            color: #1a1a2e;
        }

        .card .hero-header .type-badge {
            font-size: 0.65rem;
            background: #f3f4f6;
            color: #4b5563;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .card .hero-header .type-badge.type-战士 { background: #fef3c7; color: #92400e; }
        .card .hero-header .type-badge.type-坦克 { background: #dbeafe; color: #1e40af; }
        .card .hero-header .type-badge.type-法师 { background: #e0e7ff; color: #3730a3; }
        .card .hero-header .type-badge.type-刺客 { background: #fce4ec; color: #9a1f3c; }
        .card .hero-header .type-badge.type-射手 { background: #d1fae5; color: #065f46; }
        .card .hero-header .type-badge.type-辅助 { background: #fce7f3; color: #9d174d; }

        .card .attrs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.9rem;
            margin-top: 0.2rem;
        }

        .card .attr-item {
            display: flex;
            align-items: baseline;
            gap: 0.2rem;
            font-size: 0.85rem;
        }

        .card .attr-item .label {
            color: #6b7280;
            font-weight: 400;
            font-size: 0.8rem;
        }

        .card .attr-item .value {
            font-weight: 600;
            color: #1a1a2e;
            background: #f9fafb;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid #e5e7eb;
            min-width: 2.4rem;
            text-align: center;
        }

        .card .attr-item .value.positive {
            color: #059669;
            border-color: #a7f3d0;
            background: #ecfdf5;
        }
        .card .attr-item .value.negative {
            color: #dc2626;
            border-color: #fca5a5;
            background: #fef2f2;
        }
        .card .attr-item .value.neutral {
            color: #6b7280;
            border-color: #e5e7eb;
            background: #f9fafb;
        }
        .card .attr-item .value.empty {
            color: #9ca3af;
            border-color: #f3f4f6;
            background: transparent;
        }

        /* 其他增益样式 */
        .card .other-buff {
            margin-top: 0.7rem;
            padding-top: 0.5rem;
            border-top: 1px dashed #e5e7eb;
            font-size: 0.75rem;
            color: #4b5563;
            line-height: 1.5;
            display: flex;
            gap: 0.3rem;
        }
        .card .other-buff .buff-label {
            font-weight: 500;
            color: #6b7280;
            white-space: nowrap;
        }
        .card .other-buff .buff-desc {
            color: #1a1a2e;
            word-break: break-word;
        }

        /* ===== 空状态 & 加载 ===== */
        .no-result {
            text-align: center;
            padding: 4rem 0;
            color: #6b7280;
            font-size: 1.1rem;
        }

        .no-result span {
            display: block;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }

        .loading-tip {
            text-align: center;
            padding: 4rem 0;
            color: #6b7280;
            font-size: 1rem;
        }

        .loading-tip .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #d4a853;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: #6b7280;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 1.8rem;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .footer a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
            border-bottom: 1px dotted transparent;
        }

        .footer a:hover {
            color: #d4a853;
            border-bottom-color: #d4a853;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body { padding: 1.2rem 0.8rem; }
            .filters {
                border-radius: 30px;
                padding: 0.4rem 0.4rem 0.4rem 1rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .search-box { min-width: 140px; }
            .type-filter button { font-size: 0.75rem; padding: 0.25rem 0.6rem; }
            .grid { grid-template-columns: 1fr; }
            .card .hero-header img { width: 38px; height: 38px; }
            .header-left h1 { font-size: 1.8rem; }
            .logo-icon { font-size: 1.8rem; }
        }

        @media (max-width: 480px) {
            .filters { padding: 0.3rem 0.3rem 0.3rem 0.8rem; }
            .search-box input { font-size: 0.85rem; padding: 0.4rem 1.8rem 0.4rem 0.4rem; }
            .type-filter button { font-size: 0.7rem; padding: 0.2rem 0.5rem; }
            .card { padding: 0.9rem 1rem; }
            .stats { font-size: 0.8rem; }
            .card .other-buff { font-size: 0.7rem; }
        }
    </style>
</head>

    const resultCount = document.getElementById('resultCount');
    const matchInfo = document.getElementById('matchInfo');
    const grid = document.getElementById('heroGrid');
    const noResult = document.getElementById('noResult');
    const typeButtons = document.querySelectorAll('#typeFilter button');

    // ----- 辅助函数 -----
    function fmt(value) {
        if (value === null || value === undefined) return null;
        const num = parseFloat(value);
        if (isNaN(num)) return null;
        return Math.round(num * 100) + '%';
    }

    // 伤害、治疗、护盾：大于1为正面(绿)，小于1为负面(红)
    function getCssClass(value) {
        if (value === null || value === undefined) return 'empty';
        const num = parseFloat(value);
        if (isNaN(num)) return 'empty';
        if (num > 1) return 'positive';
        if (num < 1) return 'negative';
        return 'neutral';
    }

    // 承伤单独反向：大于1为负面(红)，小于1为正面(绿)
    function getTakenCssClass(value) {
        if (value === null || value === undefined) return 'empty';
        const num = parseFloat(value);
        if (isNaN(num)) return 'empty';
        if (num > 1) return 'negative';
        if (num < 1) return 'positive';
        return 'neutral';
    }

    // 渲染
    function render(heroList) {
        if (heroList.length === 0) {
            grid.innerHTML = '';
            noResult.style.display = 'block';
            resultCount.textContent = '共 0 位英雄';
            matchInfo.textContent = '';
            return;
        }
        noResult.style.display = 'none';
        resultCount.textContent = `共 ${heroList.length} 位英雄`;

        let html = '';
        heroList.forEach(h => {
            const dmg = fmt(h.damage);
            const tkn = fmt(h.taken);
            const heal = fmt(h.heal);
            const shield = fmt(h.shield);
            const dmgCls = getCssClass(h.damage);
            const tknCls = getTakenCssClass(h.taken);
            const healCls = getCssClass(h.heal);
            const shieldCls = getCssClass(h.shield);
            const iconPath = `./英雄联盟英雄头像_真名命名_173个/${h.name}.png`;
            const fallbackIcon = 'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/default.png';
            const typeClass = 'type-' + h.type;

            // 其他增益（如果有）
            let otherHtml = '';
            if (h.other) {
                otherHtml = `
                    <div class="other-buff">
                        <span class="buff-label">⚡ 其他增益</span>
                        <span class="buff-desc">${h.other}</span>
                    </div>
                `;
            }

            html += `
                <div class="card">
                    <div class="hero-header">
                        <img src="${iconPath}" alt="${h.name}" loading="lazy" onerror="this.src='${fallbackIcon}'">
                        <span class="hero-name">${h.name}</span>
                        <span class="type-badge ${typeClass}">${h.type}</span>
                    </div>
                    <div class="attrs">
                        <span class="attr-item">
                            <span class="label">伤害</span>
                            <span class="value ${dmgCls}">${dmg || '—'}</span>
                        </span>
                        <span class="attr-item">
                            <span class="label">承伤</span>
                            <span class="value ${tknCls}">${tkn || '—'}</span>
                        </span>
                        ${heal !== null ? `<span class="attr-item"><span class="label">治疗</span><span class="value ${healCls}">${heal}</span></span>` : ''}
                        ${shield !== null ? `<span class="attr-item"><span class="label">护盾</span><span class="value ${shieldCls}">${shield}</span></span>` : ''}
                    </div>
                    ${otherHtml}
                </div>
            `;
        });
        grid.innerHTML = html;
        matchInfo.textContent = `匹配 ${heroList.length} 个结果`;
    }

    function filterAndRender() {
        const filtered = heroes.filter(h => {
            const nameMatch = h.name.includes(searchText);
            const typeMatch = currentType === 'all' || h.type === currentType;
            return nameMatch && typeMatch;
        });
        render(filtered);
    }

    // ----- 初始化 -----
    function initHeroes() {
        grid.innerHTML = `
            <div class="loading-tip">
                <div class="spinner"></div>
                <div>正在加载英雄数据…</div>
            </div>
        `;
        resultCount.textContent = '加载中…';

        heroes = HEROES_BASE.map(h => ({ ...h }));
        filterAndRender();
    }

    // ----- 事件绑定 -----
    searchInput.addEventListener('input', function() {
        const val = this.value;
        searchText = val;
        if (val.length > 0) {
            clearBtn.classList.add('visible');
        } else {
            clearBtn.classList.remove('visible');
        }
        filterAndRender();
    });

    clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchText = '';
        clearBtn.classList.remove('visible');
        filterAndRender();
        searchInput.focus();
    });

    typeButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            typeButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentType = this.dataset.type;
            filterAndRender();
        });
    });

    function resetAll() {
        searchInput.value = '';
        searchText = '';
        clearBtn.classList.remove('visible');
        typeButtons.forEach(b => b.classList.remove('active'));
        document.querySelector('#typeFilter button[data-type="all"]').classList.add('active');
        currentType = 'all';
        filterAndRender();
        searchInput.focus();
    }

    document.querySelector('.footer a')?.addEventListener('click', function(e) {
        e.preventDefault();
        resetAll();
    });

    // 启动
    initHeroes();
