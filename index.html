    // ======================= 辅助函数 ======================
    function parseNote(note) {
        if (!note) return null;
        // 替换“同步极地大乱斗”为“极地大乱斗同步该改动”
        let corrected = note.replace(/同步极地大乱斗/g, '极地大乱斗同步该改动');
        const versionMatch = corrected.match(/(7\.2c|7\.2b|7\.1d|6\.3d)版本?/);
        let version = null;
        let desc = corrected;
        if (versionMatch) {
            version = versionMatch[1] + '版本';
            desc = corrected.replace(versionMatch[0], '').replace(/^[,，\s]+/, '').replace(/[,，\s]+$/, '');
        }
        if (!desc.trim()) desc = corrected;
        return { version: version || '其他版本', desc: desc.trim() };
    }

    function parseHeroNotes(hero) {
        const updates = [];
        if (hero.note1) {
            const entry = parseNote(hero.note1);
            if (entry) updates.push(entry);
        }
        if (hero.note2) {
            const entry = parseNote(hero.note2);
            if (entry) updates.push(entry);
        }
        updates.sort((a, b) => b.version.localeCompare(a.version));
        return updates;
    }

    // ======================= 渲染 ==========================
    function fmt(value) {
        if (value === null || value === undefined) return null;
        const num = parseFloat(value);
        if (isNaN(num)) return null;
        return Math.round(num * 100) + '%';
    }

    function getCssClass(value) {
        if (value === null || value === undefined) return 'empty';
        const num = parseFloat(value);
        if (isNaN(num)) return 'empty';
        if (num > 1) return 'positive';
        if (num < 1) return 'negative';
        return 'neutral';
    }

    function getTakenCssClass(value) {
        if (value === null || value === undefined) return 'empty';
        const num = parseFloat(value);
        if (isNaN(num)) return 'empty';
        if (num > 1) return 'negative';
        if (num < 1) return 'positive';
        return 'neutral';
    }

    function render(heroList) {
        if (heroList.length === 0) {
            grid.innerHTML = '';
            noResult.style.display = 'block';
            resultCount.textContent = '共 0 位英雄';
            matchInfo.textContent = '';
            return;
        }
        noResult.style.display = 'none';
        resultCount.textContent = `共 ${heroList.length} 位英雄`;

        let html = '';
        heroList.forEach(h => {
            const dmg = fmt(h.damage);
            const tkn = fmt(h.taken);
            const heal = fmt(h.heal);
            const shield = fmt(h.shield);
            const dmgCls = getCssClass(h.damage);
            const tknCls = getTakenCssClass(h.taken);
            const healCls = getCssClass(h.heal);
            const shieldCls = getCssClass(h.shield);
            const iconPath = `./英雄联盟英雄头像_真名命名_173个/${h.name}.png`;
            const fallbackIcon = 'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/default.png';
            const typeClass = 'type-' + h.type;

            let otherHtml = '';
            if (h.other) {
                otherHtml = `<div class="other-buff"><span class="buff-label">⚡ 其他增益</span><span class="buff-desc">${h.other}</span></div>`;
            }

            html += `
                <div class="card" data-hero="${h.name}">
                    <div class="hero-header">
                        <img src="${iconPath}" alt="${h.name}" loading="lazy" onerror="this.src='${fallbackIcon}'">
                        <span class="hero-name">${h.name}</span>
                        <span class="type-badge ${typeClass}">${h.type}</span>
                    </div>
                    <div class="attrs">
                        <span class="attr-item"><span class="label">伤害</span><span class="value ${dmgCls}">${dmg || '—'}</span></span>
                        <span class="attr-item"><span class="label">承伤</span><span class="value ${tknCls}">${tkn || '—'}</span></span>
                        ${heal !== null ? `<span class="attr-item"><span class="label">治疗</span><span class="value ${healCls}">${heal}</span></span>` : ''}
                        ${shield !== null ? `<span class="attr-item"><span class="label">护盾</span><span class="value ${shieldCls}">${shield}</span></span>` : ''}
                    </div>
                    ${otherHtml}
                </div>
            `;
        });
        grid.innerHTML = html;
        matchInfo.textContent = `匹配 ${heroList.length} 个结果`;
    }

    function filterAndRender() {
        const filtered = heroes.filter(h => {
            const nameMatch = h.name.includes(searchText);
            const typeMatch = currentType === 'all' || h.type === currentType;
            return nameMatch && typeMatch;
        });
        render(filtered);
    }

    // ======================= 模态框 ==========================
    function showHistory(heroOrAll) {
        modalBody.innerHTML = '';
        if (heroOrAll === 'all') {
            modalTitle.textContent = '📜 全部更新记录';
            const withNotes = heroes.filter(h => h.updates && h.updates.length > 0);
            if (withNotes.length === 0) {
                modalBody.innerHTML = `<div class="no-notes">暂无更新记录</div>`;
            } else {
                withNotes.sort((a, b) => a.name.localeCompare(b.name));
                let html = '';
                withNotes.forEach(h => {
                    const iconPath = `./英雄联盟英雄头像_真名命名_173个/${h.name}.png`;
                    const fallbackIcon = 'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/default.png';
                    let updatesHtml = '';
                    h.updates.forEach(u => {
                        updatesHtml += `<span class="update-entry"><span class="version">${u.version}：</span>${u.desc}</span>`;
                    });
                    html += `
                        <div class="history-item">
                            <img src="${iconPath}" alt="${h.name}" loading="lazy" onerror="this.src='${fallbackIcon}'">
                            <div class="info">
                                <div class="h-name">${h.name}</div>
                                <div class="h-notes">${updatesHtml}</div>
                            </div>
                        </div>
                    `;
                });
                modalBody.innerHTML = html;
            }
        } else {
            const hero = heroOrAll;
            modalTitle.textContent = `📜 ${hero.name} 更新记录`;
            if (!hero.updates || hero.updates.length === 0) {
                modalBody.innerHTML = `<div class="no-notes">该英雄暂无更新记录</div>`;
            } else {
                const iconPath = `./英雄联盟英雄头像_真名命名_173个/${hero.name}.png`;
                const fallbackIcon = 'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/default.png';
                let updatesHtml = '';
                hero.updates.forEach(u => {
                    updatesHtml += `<span class="update-entry"><span class="version">${u.version}：</span>${u.desc}</span>`;
                });
                modalBody.innerHTML = `
                    <div class="history-item">
                        <img src="${iconPath}" alt="${hero.name}" loading="lazy" onerror="this.src='${fallbackIcon}'">
                        <div class="info">
                            <div class="h-name">${hero.name}</div>
                            <div class="h-notes">${updatesHtml}</div>
                        </div>
                    </div>
                `;
            }
        }
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modalOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    // ======================= 事件绑定 ==========================
    btnAllHistory.addEventListener('click', function() { showHistory('all'); });
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    grid.addEventListener('click', function(e) {
        const card = e.target.closest('.card');
        if (!card) return;
        const heroName = card.dataset.hero;
        if (!heroName) return;
        const hero = heroes.find(h => h.name === heroName);
        if (hero) showHistory(hero);
    });

    searchInput.addEventListener('input', function() {
        const val = this.value;
        searchText = val;
        if (val.length > 0) clearBtn.classList.add('visible');
        else clearBtn.classList.remove('visible');
        filterAndRender();
    });
    clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchText = '';
        clearBtn.classList.remove('visible');
        filterAndRender();
        searchInput.focus();
    });

    typeButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            typeButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentType = this.dataset.type;
            filterAndRender();
        });
    });

    function resetAll() {
        searchInput.value = '';
        searchText = '';
        clearBtn.classList.remove('visible');
        typeButtons.forEach(b => b.classList.remove('active'));
        document.querySelector('#typeFilter button[data-type="all"]').classList.add('active');
        currentType = 'all';
        filterAndRender();
        searchInput.focus();
    }
    document.querySelector('.footer a')?.addEventListener('click', function(e) {
        e.preventDefault();
        resetAll();
    });

    // ======================= 初始化 ==========================
    function initHeroes() {
        grid.innerHTML = `<div class="loading-tip"><div class="spinner"></div><div>正在加载英雄数据…</div></div>`;
        resultCount.textContent = '加载中…';
        heroes = HEROES_BASE.map(h => {
            const hero = { ...h };
            hero.updates = parseHeroNotes(hero);
            return hero;
        });
        filterAndRender();
    }
    initHeroes();
</script>
</body>
</html>
