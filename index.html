<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>符文大乱斗 · 英雄属性查询</title>
	    <!-- 2. 网页描述：会显示在搜索结果标题下方，吸引用户点击 -->
	    <meta name="description" content="英雄联盟手游符文大乱斗模式英雄Buff：伤害、承伤、治疗、护盾调整一览。">

	    <!-- 3. 关键词：虽然重要性下降，但写上无妨 -->
	    <meta name="keywords" content="符文大乱斗, LOL手游, 英雄联盟手游, Buff查询, 伤害调整">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <span class="logo-icon">⚔️</span>
            <h1>符文大乱斗</h1>
            <span class="version-badge">v7.2b</span>
        </div>
        <div class="header-right">
            <button class="update-log-btn" onclick="openAllRemarksModal()">📋 全部更新记录</button>
            <div class="subtitle">英雄属性调整 · 实时查询</div>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filters">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索英雄…" autofocus>
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>
        <div class="type-filter" id="typeFilter">
            <button class="active" data-type="all">全部</button>
            <button data-type="战士">战士</button>
            <button data-type="坦克">坦克</button>
            <button data-type="法师">法师</button>
            <button data-type="刺客">刺客</button>
            <button data-type="射手">射手</button>
            <button data-type="辅助">辅助</button>
        </div>
    </div>

    <!-- 统计 -->
    <div class="stats">
        <span class="count" id="resultCount">加载中…</span>
        <span class="match-info" id="matchInfo"></span>
    </div>

    <!-- 英雄网格 -->
    <div id="heroGrid" class="grid"></div>
    <div id="noResult" class="no-result" style="display:none;">
        <span>🕵️</span> 没有找到匹配的英雄
    </div>

    <!-- 页脚 -->
    <div class="footer">
        <span>数据基于 7.2b / 7.1d / 6.3d 版本</span>
        <a onclick="resetAll();">重置筛选</a>
        <span>分类基于英雄联盟手游官网</span>
    </div>

</div>

<!-- 备注弹窗 -->
<div class="modal-overlay" id="remarkModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">📝 历史调整</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- 动态渲染 -->
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
